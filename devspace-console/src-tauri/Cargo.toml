[package]
name = "devspace-console"
version = "1.0.0"
description = "Lightweight desktop log viewer for DevSpace workspaces"
authors = ["DevSpace"]
edition = "2021"

[lib]
name = "devspace_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
